  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%;
    font-family:'Hiragino Mincho ProN','Yu Mincho',serif;-webkit-user-select:none;user-select:none;touch-action:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;}
  canvas{image-rendering:pixelated;background:#000;max-width:100%;max-height:100%;}

<div id="wrap"><canvas id="cv"></canvas></div>
<script>
'use strict';
/* ============================================================
   HIZA Shooting  - 単一HTMLプロトタイプ
   - 論理解像度 480x270 / 固定タイムステップ
   - 宇宙ベース背景 + ステージ別テーマ
   - 入力: pressed(立ち上がり)/held(長押し) を毎フレームcommitで確定
   - 装備確定=pressed / ボム=pressed / スロー=held
   - タイトル画像 hiza.jpg（失敗時はテキストロゴ）
   - 外部BGM menu/stage1/stage2/stage3/boss.mp3 (無ければシンセ)
   ============================================================ */

const LOGW=480, LOGH=270;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');

/* ---------- 解像度フィット ---------- */
function fit(){
  const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  const ar=LOGW/LOGH;
  let w=window.innerWidth, h=window.innerHeight;
  if(w/h>ar){ w=h*ar; } else { h=w/ar; }
  cv.style.width=w+'px'; cv.style.height=h+'px';
  cv.width=Math.round(LOGW*dpr); cv.height=Math.round(LOGH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled=false;
}
window.addEventListener('resize',fit);

/* ---------- タイトル画像 ---------- */
const titleImg=new Image();
let titleImgReady=false;
titleImg.onload=()=>{titleImgReady=true;};
titleImg.onerror=()=>{titleImgReady=false;};
titleImg.src='hiza.jpg';

/* ============================================================
   入力
   ============================================================ */
const GAME_KEYS=new Set([
  'ArrowUp','ArrowDown','ArrowLeft','ArrowRight',
  'KeyZ','KeyX','KeyC','ShiftLeft','ShiftRight','Space','KeyP','Escape','Enter'
]);
const Input={
  keys:{}, prev:{},
  init(){
    addEventListener('keydown',e=>{ if(GAME_KEYS.has(e.code))e.preventDefault(); this.keys[e.code]=true; });
    addEventListener('keyup',  e=>{ if(GAME_KEYS.has(e.code))e.preventDefault(); this.keys[e.code]=false; });
    addEventListener('blur',()=>{ this.keys={}; this.prev={}; });
  },
  pressed(c){ return !!this.keys[c] && !this.prev[c]; },
  held(c){ return !!this.keys[c]; },
  commit(){ this.prev=Object.assign({},this.keys); }
};

/* ---------- タッチ（仮想スティック + ボタン） ---------- */
const Touch={
  active:false, moveId:-1, mx:0,my:0, bx:0,by:0,   // 移動スティック
  fire:false,
  slow:false, equip:false, bomb:false, equipEdge:false, bombEdge:false,
  _equipPrev:false, _bombPrev:false,
  buttons:[], // {key, x,y,r, id}
  init(){
    this.buttons=[
      {key:'slow', label:'低速', x:LOGW-138, y:LOGH-34, r:24, id:-1},
      {key:'equip',label:'装備', x:LOGW-80,  y:LOGH-34, r:24, id:-1},
      {key:'bomb', label:'法力', x:LOGW-30,  y:LOGH-58, r:24, id:-1},
    ];
    const scale=()=>({sx:LOGW/cv.clientWidth, sy:LOGH/cv.clientHeight});
    const toLogic=(t)=>{ const r=cv.getBoundingClientRect(); const s=scale();
      return {x:(t.clientX-r.left)*s.sx, y:(t.clientY-r.top)*s.sy}; };
    const onStart=(e)=>{
      e.preventDefault();
      for(const t of e.changedTouches){
        const p=toLogic(t); let onBtn=false;
        for(const b of this.buttons){
          if((p.x-b.x)**2+(p.y-b.y)**2 < (b.r+6)**2){ b.id=t.identifier; onBtn=true; break; }
        }
        if(onBtn) continue;
        if(p.x<LOGW*0.42 && this.moveId<0){ this.moveId=t.identifier; this.bx=p.x; this.by=p.y; this.mx=p.x; this.my=p.y; }
        else { this.fire=true; }
      }
      this._sync();
    };
    const onMove=(e)=>{
      e.preventDefault();
      for(const t of e.changedTouches){
        const p=toLogic(t);
        if(t.identifier===this.moveId){ this.mx=p.x; this.my=p.y; }
      }
    };
    const onEnd=(e)=>{
      e.preventDefault();
      for(const t of e.changedTouches){
        if(t.identifier===this.moveId){ this.moveId=-1; }
        for(const b of this.buttons){ if(b.id===t.identifier) b.id=-1; }
      }
      // 射撃指が全部離れたら停止判定（移動・ボタン以外の指が無ければ）
      let firing=false;
      for(const t of e.touches){
        const p=toLogic(t); let onCtl=false;
        if(t.identifier===this.moveId) onCtl=true;
        for(const b of this.buttons){ if(b.id===t.identifier) onCtl=true; }
        if(!onCtl && p.x>=LOGW*0.42) firing=true;
      }
      this.fire=firing;
      this._sync();
    };
    cv.addEventListener('touchstart',onStart,{passive:false});
    cv.addEventListener('touchmove', onMove ,{passive:false});
    cv.addEventListener('touchend',  onEnd ,{passive:false});
    cv.addEventListener('touchcancel',onEnd,{passive:false});
  },
  _sync(){
    this.slow = this.buttons[0].id>=0;
    this.equip= this.buttons[1].id>=0;
    this.bomb = this.buttons[2].id>=0;
    this.active = this.moveId>=0 || this.fire || this.slow||this.equip||this.bomb;
  },
  commit(){
    this.equipEdge = this.equip && !this._equipPrev;
    this.bombEdge  = this.bomb  && !this._bombPrev;
    this._equipPrev=this.equip; this._bombPrev=this.bomb;
  },
  dir(){
    if(this.moveId<0) return {x:0,y:0};
    let dx=this.mx-this.bx, dy=this.my-this.by;
    const len=Math.hypot(dx,dy); const dz=4;
    if(len<dz) return {x:0,y:0};
    const max=26; const k=Math.min(1,len/max);
    return {x:(dx/len)*k, y:(dy/len)*k};
  }
};

/* ============================================================
   オーディオ（Web Audio合成 + 外部mp3クロスフェード）
   ============================================================ */
const Audio2={
  ctx:null, master:null, ready:false,
  trackA:null, trackB:null, cur:'A',
  buffers:{}, sources:{}, gains:{}, want:null, useMp3:{}, 
  files:{menu:'menu.mp3',stage1:'stage1.mp3',stage2:'stage2.mp3',stage3:'stage3.mp3',boss:'boss.mp3'},
  synthGain:null, synthOsc:[], synthKey:null,
  boot(){
    if(this.ready) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    this.ctx=new AC();
    this.master=this.ctx.createGain(); this.master.gain.value=0.5; this.master.connect(this.ctx.destination);
    this.gains.A=this.ctx.createGain(); this.gains.A.gain.value=0; this.gains.A.connect(this.master);
    this.gains.B=this.ctx.createGain(); this.gains.B.gain.value=0; this.gains.B.connect(this.master);
    this.synthGain=this.ctx.createGain(); this.synthGain.gain.value=0; this.synthGain.connect(this.master);
    this.ready=true;
    // mp3 先読み（失敗してもシンセで継続）
    for(const k in this.files){ this._load(k,this.files[k]); }
  },
  async _load(key,url){
    try{
      const res=await fetch(url); if(!res.ok) throw 0;
      const arr=await res.arrayBuffer();
      this.buffers[key]=await this.ctx.decodeAudioData(arr);
      this.useMp3[key]=true;
      if(this.want===key) this.play(key); // ロード完了時に切替
    }catch(e){ this.useMp3[key]=false; }
  },
  play(key){
    if(!this.ready) return;
    this.want=key;
    if(this.buffers[key]){
      this._playMp3(key);
    }else{
      this._playSynth(key);
    }
  },
  _playMp3(key){
    const next = this.cur==='A'?'B':'A';
    const g=this.gains[next];
    // 停止中シンセはフェードアウト
    this._fade(this.synthGain,0,1.2);
    const src=this.ctx.createBufferSource();
    src.buffer=this.buffers[key]; src.loop=true; src.connect(g); src.start();
    if(this.sources[this.cur]){ const old=this.sources[this.cur];
      this._fade(this.gains[this.cur],0,1.2); setTimeout(()=>{try{old.stop();}catch(e){}},1300); }
    this.sources[next]=src; this._fade(g,0.8,1.2); this.cur=next;
  },
  _fade(gn,to,sec){
    const t=this.ctx.currentTime;
    gn.gain.cancelScheduledValues(t);
    gn.gain.setValueAtTime(gn.gain.value,t);
    gn.gain.linearRampToValueAtTime(to,t+sec);
  },
  // シンプルなシンセBGM（mp3が無い時のフォールバック）
  _playSynth(key){
    // 既存mp3トラックをフェードアウト
    this._fade(this.gains.A,0,1.2); this._fade(this.gains.B,0,1.2);
    this.synthOsc.forEach(o=>{try{o.stop();}catch(e){}}); this.synthOsc=[];
    const scales={
      menu:[220,277,330,415], stage1:[262,330,392,494],
      stage2:[247,294,370,440], stage3:[262,311,392,466], boss:[196,247,294,370]
    };
    const sc=scales[key]||scales.stage1;
    const make=(type,detune,vol)=>{
      const o=this.ctx.createOscillator(); const g=this.ctx.createGain();
      o.type=type; o.detune.value=detune; g.gain.value=vol;
      o.connect(g); g.connect(this.synthGain); o.start();
      return {o,g};
    };
    const lead=make('square',0,0.18);
    const bass=make('triangle',0,0.22);
    this.synthOsc=[lead.o,bass.o];
    let step=0;
    this.synthKey=key;
    clearInterval(this._seq);
    this._seq=setInterval(()=>{
      if(this.synthKey!==key){ clearInterval(this._seq); return; }
      const n=sc[step%sc.length];
      lead.o.frequency.setValueAtTime(n, this.ctx.currentTime);
      bass.o.frequency.setValueAtTime(n/2, this.ctx.currentTime);
      step++;
    }, key==='boss'?180:240);
    this._fade(this.synthGain,0.5,1.2);
  },
  // SE
  se(type){
    if(!this.ready) return;
    const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator(); const g=this.ctx.createGain();
    o.connect(g); g.connect(this.master);
    if(type==='shot'){ o.type='square'; o.frequency.setValueAtTime(880,t); o.frequency.exponentialRampToValueAtTime(440,t+0.06); g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.08); o.start(t); o.stop(t+0.09); }
    else if(type==='hit'){ o.type='sawtooth'; o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(60,t+0.12); g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.14); o.start(t); o.stop(t+0.15); }
    else if(type==='power'){ o.type='triangle'; o.frequency.setValueAtTime(440,t); o.frequency.linearRampToValueAtTime(880,t+0.12); g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16); o.start(t); o.stop(t+0.17); }
    else if(type==='death'){ o.type='sawtooth'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(40,t+0.5); g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.55); o.start(t); o.stop(t+0.6); }
    else if(type==='bomb'){ o.type='sawtooth'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(800,t+0.3); g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4); o.start(t); o.stop(t+0.45); }
  }
};

/* ============================================================
   オブジェクトプール
   ============================================================ */
function Pool(factory,size){ this.items=[]; for(let i=0;i<size;i++){const o=factory();o.active=false;this.items.push(o);} }
Pool.prototype.get=function(){ for(const o of this.items){ if(!o.active){o.active=true;return o;} } return null; };
Pool.prototype.each=function(fn){ for(const o of this.items){ if(o.active) fn(o); } };

const pBullets=new Pool(()=>({x:0,y:0,vx:0,vy:0,r:2}),200);
const eBullets=new Pool(()=>({x:0,y:0,vx:0,vy:0,r:3,kind:0}),400);
const enemies =new Pool(()=>({x:0,y:0,vx:0,vy:0,hp:1,type:'pop',t:0,r:8,fire:0,hitFlash:0,carry:false}),80);
const parts   =new Pool(()=>({x:0,y:0,vx:0,vy:0,life:0,max:0,col:'#fff',r:1}),400);
const caps    =new Pool(()=>({x:0,y:0,vy:0.6,r:6}),30);

function spawnPart(x,y,col,n,spd){ for(let i=0;i<n;i++){ const p=parts.get(); if(!p)return; const a=Math.random()*Math.PI*2; const s=Math.random()*spd; p.x=x;p.y=y;p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s;p.max=p.life=20+Math.random()*16;p.col=col;p.r=1+Math.random()*1.5; } }

/* ============================================================
   難易度
   ============================================================ */
const DIFF={
  easy:  {fireMul:2.4, bulletMul:0.6, bSpd:0.7, hpMul:0.6, bossHpMul:0.55, invuln:160, lives:5, bombs:5, ramp:0.5, omni:false, label:'やさしい'},
  normal:{fireMul:1.5, bulletMul:0.85,bSpd:0.9, hpMul:1.0, bossHpMul:1.0,  invuln:120, lives:3, bombs:3, ramp:1.0, omni:false, label:'ふつう'},
  hard:  {fireMul:1.1, bulletMul:1.05,bSpd:1.1, hpMul:1.25,bossHpMul:1.3,  invuln:100, lives:3, bombs:2, ramp:1.4, omni:true,  label:'むずかしい'}
};
let diff=DIFF.normal, diffKey='normal';

/* ============================================================
   ステージテーマ & ストーリー
   ============================================================ */
const STAGE_THEME={
  1:{name:'残骸帯',     bgTop:'#0a0e1a',bgBot:'#1a2440',star:'#9fd2ff',accent:'#4ea1ff',parallax:'debris',bgm:'stage1'},
  2:{name:'紅蓮星雲',   bgTop:'#1a0a12',bgBot:'#3a1020',star:'#ffb0c8',accent:'#ff5a7a',parallax:'nebula',bgm:'stage2'},
  3:{name:'膝（コア）', bgTop:'#0a1410',bgBot:'#0f2a1c',star:'#aef5c8',accent:'#2fe08a',parallax:'fluid', bgm:'stage3'}

/* ============================================================
   ステージ波データ（伸長版）
   t=フレーム。各ステージ約3〜4分相当に拡張。carry=膝カプセル持ち。
   ============================================================ */
function buildWaves(stage){
  const W=[]; const push=(t,fn)=>W.push({t,fn,done:false});
  const themeAcc=STAGE_THEME[stage].accent;
  const line=(t,type,n,y0,dy,opt)=>push(t,()=>{ for(let i=0;i<n;i++){ const e=enemies.get(); if(!e)break; initEnemy(e,type,LOGW+20+i*22, y0+i*dy, opt); } });
  const carrier=(t,y)=>push(t,()=>{ const e=enemies.get(); if(!e)return; initEnemy(e,'carrier',LOGW+20,y,{}); });

  if(stage===1){
    line(60,'pop',5,40,16); line(150,'pop',5,180,-16);
    line(260,'wave',4,80,20); carrier(360,135);
    line(460,'dasher',3,60,40); line(560,'pop',6,30,30);
    line(700,'wave',5,50,30); carrier(820,90);
    line(940,'dasher',4,40,45); line(1060,'pop',6,150,-20);
    line(1180,'wave',5,60,28); carrier(1300,150);
    line(1420,'dasher',4,80,30); line(1540,'pop',8,30,26);
    carrier(1680,120);
    line(1800,'wave',6,40,32);
    push(1980,()=>{boss.spawn(1);});
  }
  if(stage===2){
    line(60,'wave',5,40,18); line(160,'splitter',3,60,50);
    carrier(280,135); line(400,'splitter',4,40,45);
    line(520,'pop',6,30,30); line(640,'wave',6,50,28);
    carrier(760,90); line(880,'splitter',4,70,40);
    line(1000,'pop',8,20,28); line(1140,'wave',6,40,32);
    carrier(1260,150); line(1380,'splitter',5,40,42);
    line(1520,'pop',8,30,26); line(1660,'wave',7,30,30);
    carrier(1800,120); line(1920,'splitter',5,50,40);
    push(2120,()=>{boss.spawn(2);});
  }
  if(stage===3){
    line(60,'homer',3,60,50); line(160,'wave',5,40,20);
    carrier(280,135); line(400,'homer',4,40,45);
    line(520,'splitter',3,60,50); line(640,'pop',8,20,28);
    carrier(760,90); line(880,'homer',4,70,40);
    line(1000,'dasher',4,40,40); line(1140,'wave',7,30,30);
    carrier(1260,150); line(1380,'homer',5,40,42);
    line(1520,'splitter',4,40,45); line(1660,'pop',10,20,24);
    carrier(1800,120); line(1920,'homer',5,50,40);
    line(2060,'dasher',5,40,38);
    push(2260,()=>{boss.spawn(3);});
  }
  return W;
}

/* ============================================================
   敵
   ============================================================ */
function initEnemy(e,type,x,y,opt){
  e.active=true; e.type=type; e.x=x; e.y=y; e.t=0; e.fire=0; e.hitFlash=0; e.carry=(type==='carrier');
  const base={pop:[3,8],wave:[4,9],dasher:[3,8],splitter:[5,9],homer:[5,9],carrier:[6,11]}[type];
  e.hp=Math.ceil(base[0]*diff.hpMul); e.r=base[1];
  e.vx=-1.0; e.vy=0;
  if(type==='dasher'){ e.vx=-0.6; }
}
function updateEnemy(e){
  e.t++; if(e.hitFlash>0)e.hitFlash--;
  const fireBase={pop:170,wave:120,dasher:9999,splitter:9999,homer:150,carrier:200}[e.type];
  switch(e.type){
    case 'pop': e.x+=e.vx; e.y+=Math.sin(e.t*0.05)*0.6; break;
    case 'wave': e.x+=e.vx*0.9; e.y+=Math.sin(e.t*0.08)*1.6; break;
    case 'dasher':
      if(e.t<40){ e.x+=e.vx; } else { e.vx-=0.12; e.x+=e.vx; } break;
    case 'splitter': e.x+=e.vx*0.8; e.y+=Math.cos(e.t*0.06)*0.8; break;
    case 'homer':
      e.x+=e.vx*0.8;
      { const dy=player.y-e.y; e.y+=Math.sign(dy)*Math.min(0.7,Math.abs(dy)*0.02); } break;
    case 'carrier': e.x+=e.vx*0.7; e.y+=Math.sin(e.t*0.03)*0.5; break;
  }
  // 発砲（画面外は撃たない）
  if(e.x<LOGW-10 && fireBase<9999){
    e.fire++;
    const interval=Math.round(fireBase/diff.fireMul);
    if(e.fire>=interval){ e.fire=0; enemyShoot(e); }
  }
  if(e.x<-30||e.y<-40||e.y>LOGH+40) e.active=false;
}
function enemyShoot(e){
  const spd=(1.4*diff.bSpd*diff.bulletMul);
  if(e.type==='homer'){
    const b=eBullets.get(); if(!b)return;
    const a=Math.atan2(player.y-e.y,player.x-e.x);
    b.active=true;b.x=e.x;b.y=e.y;b.vx=Math.cos(a)*spd;b.vy=Math.sin(a)*spd;b.r=3;b.kind=2;
  }else{
    const a=Math.atan2(player.y-e.y,player.x-e.x);
    const b=eBullets.get(); if(!b)return;
    b.active=true;b.x=e.x;b.y=e.y;b.vx=Math.cos(a)*spd;b.vy=Math.sin(a)*spd;b.r=3;b.kind=(e.type==='wave'?1:0);
  }
}
function killEnemy(e){
  if(e.type==='splitter'){ // 撃破時8方向小弾
    for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; const b=eBullets.get(); if(!b)break;
      b.active=true;b.x=e.x;b.y=e.y;b.vx=Math.cos(a)*1.3*diff.bSpd;b.vy=Math.sin(a)*1.3*diff.bSpd;b.r=2.5;b.kind=3; }
  }
  spawnPart(e.x,e.y,'#ffd28a',12,2.4);
  Audio2.se('hit');
  game.score+=e.carry?50:10;
  game.combo++; game.comboTimer=90;
  if(game.combo>game.maxCombo)game.maxCombo=game.combo;
  if(e.carry){ const c=caps.get(); if(c){ c.active=true; c.x=e.x; c.y=e.y; c.vy=0.6; } }
  e.active=false;
}

/* ============================================================
   ボス
   ============================================================ */
const boss={
  active:false, x:0,y:0, hp:0, max:0, t:0, stage:1, phase2:false, hitFlash:0, intro:0,
  spawn(stage){
    this.active=true; this.stage=stage; this.x=LOGW+60; this.y=LOGH/2;
    this.max=this.hp=Math.round((220+stage*90)*diff.bossHpMul);
    this.t=0; this.phase2=false; this.hitFlash=0; this.intro=120;
    Audio2.play('boss');
    game.bossWarn=120;
  },
  update(){
    if(this.intro>0){ this.intro--; this.x+=(LOGW-90-this.x)*0.04; return; }
    this.t++; if(this.hitFlash>0)this.hitFlash--;
    this.y=LOGH/2+Math.sin(this.t*0.02)*70;
    if(this.hp<=this.max*0.5) this.phase2=true;
    // 弾幕
    const fi=Math.round((this.stage===3?34:46)/diff.fireMul);
    if(this.t%fi===0){
      const n=4+this.stage;
      const base=Math.atan2(player.y-this.y,player.x-this.x);
      for(let i=0;i<n;i++){
        const a=base-(n-1)*0.12/2 + i*0.12;
        const b=eBullets.get(); if(!b)break;
        b.active=true;b.x=this.x-20;b.y=this.y;b.vx=Math.cos(a)*1.6*diff.bSpd;b.vy=Math.sin(a)*1.6*diff.bSpd;b.r=3.5;b.kind=4;
      }
    }
    if((this.phase2||diff.omni) && this.t%70===0){ // 全方位弾
      const n=14;
      for(let i=0;i<n;i++){ const a=i/n*Math.PI*2 + this.t*0.02;
        const b=eBullets.get(); if(!b)break;
        b.active=true;b.x=this.x;b.y=this.y;b.vx=Math.cos(a)*1.3*diff.bSpd;b.vy=Math.sin(a)*1.3*diff.bSpd;b.r=3;b.kind=5; }
    }
  },
  hit(d){ this.hp-=d; this.hitFlash=4; if(this.hp<=0){ this.die(); } },
  die(){
    this.active=false;
    for(let i=0;i<60;i++) setTimeout=null; // 演出はフレーム駆動側で
    bigBoom.start(this.x,this.y);
    game.score+=1000*this.stage;
    Audio2.se('death');
  }
};

/* 大爆発（フレーム駆動） */
const bigBoom={ on:false, x:0,y:0, t:0,
  start(x,y){ this.on=true; this.x=x; this.y=y; this.t=0; game.shake=18; },
  update(){ if(!this.on)return; this.t++;
    if(this.t%3===0) spawnPart(this.x+(Math.random()-0.5)*60, this.y+(Math.random()-0.5)*60, '#ffcf66', 16, 3);
    if(this.t>=70){ this.on=false; game.onBossDead(); } }
};

/* ============================================================
   プレイヤー
   ============================================================ */
const player={
  x:80,y:LOGH/2, r:2, speed:2.4, slow:1, alive:true, invuln:0, fireCd:0,
  power:0, // パワーバー位置 0..5
  pendingPower:0, // 取得カプセル数（装備確定で消費）
  options:[], // 追従オプション座標履歴
  trail:[],
  reset(){ this.x=80;this.y=LOGH/2;this.alive=true;this.invuln=diff.invuln;this.power=0;this.pendingPower=0;this.options=[];this.trail=[];this.fireCd=0; },
  update(slowHeld){
    if(!this.alive)return;
    if(this.invuln>0)this.invuln--;
    let dx=0,dy=0;
    if(Input.held('ArrowLeft'))dx-=1; if(Input.held('ArrowRight'))dx+=1;
    if(Input.held('ArrowUp'))dy-=1; if(Input.held('ArrowDown'))dy+=1;
    const td=Touch.dir(); dx+=td.x; dy+=td.y;
    const sp=this.speed*(slowHeld?0.45:1);
    if(dx||dy){ const l=Math.hypot(dx,dy)||1; this.x+=dx/l*sp*(Math.hypot(dx,dy)>1?1:Math.hypot(dx,dy)); this.y+=dy/l*sp*(Math.hypot(dx,dy)>1?1:Math.hypot(dx,dy)); }
    this.x=Math.max(8,Math.min(LOGW-8,this.x)); this.y=Math.max(8,Math.min(LOGH-8,this.y));
    // trail（オプション追従用）
    this.trail.unshift({x:this.x,y:this.y}); if(this.trail.length>60)this.trail.pop();
    // 射撃
    if(this.fireCd>0)this.fireCd--;
    const firing=Input.held('KeyZ')||Input.held('Space')||Touch.fire;
    if(firing && this.fireCd===0){ this.shoot(); this.fireCd=Math.max(4,7-this.power); }
  },
  shoot(){
    const make=(x,y,vy)=>{ const b=pBullets.get(); if(!b)return; b.active=true;b.x=x;b.y=y;b.vx=6;b.vy=vy||0;b.r=2; };
    make(this.x+8,this.y,0);
    if(this.power>=2){ make(this.x+8,this.y,-0.6); make(this.x+8,this.y,0.6); }
    // オプション
    const nopt=Math.min(2,Math.max(0,this.power-2));
    for(let i=0;i<nopt;i++){ const idx=(i+1)*18; const p=this.trail[idx]; if(p) make(p.x+6,p.y,0); }
    Audio2.se('shot');
  },
  applyPower(){ if(this.pendingPower>0){ this.power=Math.min(5,this.power+1); this.pendingPower=0; Audio2.se('power'); } },
};

/* ============================================================
   ゲーム状態
   ============================================================ */
const game={
  state:'title', // title, story, controls, playing, paused, stagestory, ending, gameover
  stage:1, score:0, combo:0, maxCombo:0, comboTimer:0,
  lives:3, bombs:3, t:0, shake:0, hitStop:0,
  waves:[], bossWarn:0, bannerT:0, banner:'',
  story:{lines:[],idx:0,char:0,cb:null,box:null},
  difficulties:['easy','normal','hard'], diffSel:1,
  start(){
    diffKey=this.difficulties[this.diffSel]; diff=DIFF[diffKey];
    this.stage=1; this.score=0; this.combo=0; this.maxCombo=0;
    this.lives=diff.lives; this.bombs=diff.bombs;
    Audio2.boot();
    this.beginStory(STORY_OPENING, ()=>this.beginStage(1));
  },
  beginStory(lines,cb){
    this.state='story';
    this.story={lines:lines.slice(),idx:0,char:0,cb:cb,box:{x:40,y:50,w:LOGW-80,h:LOGH-100}};
    Audio2.play('menu');
  },
  beginStage(n){
    this.stage=n; this.t=0;
    player.reset();
    [pBullets,eBullets,enemies,parts,caps].forEach(p=>p.each(o=>o.active=false));
    boss.active=false; bigBoom.on=false;
    this.waves=buildWaves(n);
    this.banner=`第${n}ステージ：${STAGE_THEME[n].name}`; this.bannerT=140;
    this.state='playing';
    Audio2.play(STAGE_THEME[n].bgm);
  },
  onBossDead(){
    if(this.stage<3){
      const story = this.stage===1?STORY_STAGE2:STORY_STAGE3;
      this.beginStory(story, ()=>this.beginStage(this.stage+1));
    }else{
      this.beginStory(STORY_ENDING, ()=>{ this.state='ending'; Audio2.play('menu'); });
    }
  },
  playerDie(){
    if(player.invuln>0||!player.alive)return;
    Audio2.se('death'); this.shake=14; this.combo=0;
    spawnPart(player.x,player.y,'#9fd2ff',24,3);
    this.lives--;
    player.power=Math.max(0,player.power-2);
    if(this.lives<0){ this.state='gameover'; Audio2.play('menu'); }
    else { player.x=80;player.y=LOGH/2;player.invuln=diff.invuln; }
  },
  useBomb(){
    if(this.bombs<=0)return;
    this.bombs--; Audio2.se('bomb'); this.shake=16;
    eBullets.each(b=>{ b.active=false; spawnPart(b.x,b.y,'#fff',3,1.5); });
    enemies.each(e=>{ e.hp-=8; if(e.hp<=0)killEnemy(e); else e.hitFlash=3; });
    if(boss.active&&boss.intro<=0) boss.hit(30);
  }
};

/* ============================================================
   更新
   ============================================================ */
function update(){
  game.t++;
  if(game.shake>0)game.shake*=0.9;
  if(game.comboTimer>0){ game.comboTimer--; if(game.comboTimer===0)game.combo=0; }
  if(game.bannerT>0)game.bannerT--;
  if(game.bossWarn>0)game.bossWarn--;

  if(game.state==='playing'){
    if(game.hitStop>0){ game.hitStop--; return; }
    const slowHeld=Input.held('ShiftLeft')||Input.held('ShiftRight')||Touch.slow;
    player.update(slowHeld);

    // 装備確定
    if(Input.pressed('KeyX')||Touch.equipEdge){ player.applyPower(); }
    // ボム
    if(Input.pressed('KeyC')||Touch.bombEdge){ game.useBomb(); }
    // ポーズ
    if(Input.pressed('KeyP')||Input.pressed('Escape')){ game.state='paused'; return; }

    // 波出現
    for(const w of game.waves){ if(!w.done && game.t>=w.t){ w.fn(); w.done=true; } }

    // 自弾
    pBullets.each(b=>{ b.x+=b.vx; b.y+=b.vy; if(b.x>LOGW+10||b.y<-10||b.y>LOGH+10)b.active=false; });
    // 敵
    enemies.each(updateEnemy);
    // 敵弾
    eBullets.each(b=>{ b.x+=b.vx; b.y+=b.vy; if(b.x<-12||b.x>LOGW+12||b.y<-12||b.y>LOGH+12)b.active=false; });
    // パーティクル
    parts.each(p=>{ p.x+=p.vx;p.y+=p.vy;p.vx*=0.94;p.vy*=0.94;p.life--; if(p.life<=0)p.active=false; });
    // カプセル
    caps.each(c=>{ c.x-=1.2; if(c.x<-10)c.active=false; });
    // ボス
    if(boss.active)boss.update();
    if(bigBoom.on)bigBoom.update();

    collisions();
  }
  else if(game.state==='paused'){
    if(Input.pressed('KeyP')||Input.pressed('Escape')) game.state='playing';
  }
  else if(game.state==='story'){
    const s=game.story;
    if(s.idx<s.lines.length){
      s.char+=0.8;
      if(s.char>=s.lines[s.idx].length){
        // 行完了。次の入力で進む
        if(Input.pressed('KeyZ')||Input.pressed('Space')||Input.pressed('Enter')||Touch.fire){
          s.idx++; s.char=0;
        }
      } else {
        if(Input.pressed('KeyZ')||Input.pressed('Space')||Input.pressed('Enter')||Touch.fire){
          s.char=s.lines[s.idx].length; // 早送り
        }
      }
    } else {
      if(Input.pressed('KeyZ')||Input.pressed('Space')||Input.pressed('Enter')||Touch.fire){ if(s.cb)s.cb(); }
    }
  }
  else if(game.state==='title'){
    if(Input.pressed('ArrowLeft')) game.diffSel=(game.diffSel+2)%3;
    if(Input.pressed('ArrowRight'))game.diffSel=(game.diffSel+1)%3;
    if(Input.pressed('KeyZ')||Input.pressed('Space')||Input.pressed('Enter')||Touch.fire){
      Audio2.boot(); game.state='controls';
    }
  }
  else if(game.state==='controls'){
    if(Input.pressed('KeyZ')||Input.pressed('Space')||Input.pressed('Enter')||Touch.fire){ game.start(); }
  }
  else if(game.state==='ending'||game.state==='gameover'){
    if(Input.pressed('KeyZ')||Input.pressed('Space')||Input.pressed('Enter')||Touch.fire){
      game.state='title';
    }
  }
}

function collisions(){
  // 自弾→敵
  pBullets.each(b=>{
    enemies.each(e=>{
      if(!b.active||!e.active)return;
      if((b.x-e.x)**2+(b.y-e.y)**2 < (e.r+b.r)**2){
        b.active=false; e.hp--; e.hitFlash=2; spawnPart(b.x,b.y,'#fff',2,1.2);
        if(e.hp<=0) killEnemy(e);
      }
    });
    if(boss.active&&boss.intro<=0&&b.active){
      if((b.x-boss.x)**2+(b.y-boss.y)**2 < (24+b.r)**2){ b.active=false; boss.hit(1); spawnPart(b.x,b.y,'#fff',2,1.2); }
    }
  });
  if(player.invuln>0||!player.alive)return;
  // 敵弾→自機（極小ヒットボックス）
  eBullets.each(b=>{
    if(!b.active)return;
    if((b.x-player.x)**2+(b.y-player.y)**2 < (b.r+player.r)**2){ game.hitStop=6; game.playerDie(); }
  });
  // 敵体当たり
  enemies.each(e=>{ if(!e.active)return;
    if((e.x-player.x)**2+(e.y-player.y)**2 < (e.r+player.r+2)**2){ game.hitStop=6; game.playerDie(); } });
  // カプセル取得
  caps.each(c=>{ if(!c.active)return;
    if((c.x-player.x)**2+(c.y-player.y)**2 < (c.r+6)**2){ c.active=false; player.pendingPower++; Audio2.se('power'); game.score+=30; } });
}

/* ============================================================
   描画
   ============================================================ */
let starsBG=[];
for(let i=0;i<90;i++) starsBG.push({x:Math.random()*LOGW,y:Math.random()*LOGH,z:Math.random()*2+0.4});

function drawBackground(theme){
  const g=ctx.createLinearGradient(0,0,0,LOGH);
  g.addColorStop(0,theme.bgTop); g.addColorStop(1,theme.bgBot);
  ctx.fillStyle=g; ctx.fillRect(0,0,LOGW,LOGH);
  // 星（パララックス）
  for(const s of starsBG){
    s.x-=s.z*(0.6+game.t*0); s.x-=s.z;
    if(s.x<0){s.x=LOGW;s.y=Math.random()*LOGH;}
    ctx.globalAlpha=0.3+s.z*0.3; ctx.fillStyle=theme.star;
    ctx.fillRect(s.x,s.y,s.z,s.z);
  }
  ctx.globalAlpha=1;
  // ステージ固有レイヤー
  if(theme.parallax==='debris'){
    ctx.fillStyle='rgba(120,140,180,0.12)';
    for(let i=0;i<6;i++){ const x=((game.t*0.4+i*90)%(LOGW+60))-30; const y=40+i*38;
      ctx.beginPath();ctx.ellipse(LOGW-x,y,16,7,i,0,7);ctx.fill(); }
  } else if(theme.parallax==='nebula'){
    for(let i=0;i<4;i++){ const x=((game.t*0.3+i*140)%(LOGW+120))-60;
      const rg=ctx.createRadialGradient(LOGW-x,80+i*40,2,LOGW-x,80+i*40,60);
      rg.addColorStop(0,'rgba(255,90,122,0.10)');rg.addColorStop(1,'rgba(255,90,122,0)');
      ctx.fillStyle=rg; ctx.fillRect(LOGW-x-60,20+i*40,120,120); }
  } else if(theme.parallax==='fluid'){
    // 膝の水：下から水位が上がる
    const wl=LOGH - Math.min(LOGH*0.6, game.t*0.04);
    ctx.fillStyle='rgba(47,224,138,0.10)';
    ctx.beginPath(); ctx.moveTo(0,LOGH);
    for(let x=0;x<=LOGW;x+=20){ ctx.lineTo(x, wl+Math.sin(x*0.05+game.t*0.05)*4); }
    ctx.lineTo(LOGW,LOGH); ctx.closePath(); ctx.fill();
  }
}

function drawShip(x,y,bank,inv){
  if(inv && Math.floor(game.t/4)%2===0) ctx.globalAlpha=0.4;
  ctx.save(); ctx.translate(x,y);
  // 本体
  ctx.fillStyle='#e8eef7';
  ctx.beginPath();
  ctx.moveTo(11,0); ctx.lineTo(-7,-5+bank); ctx.lineTo(-3,0); ctx.lineTo(-7,5+bank); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#7fb3ff';
  ctx.beginPath(); ctx.moveTo(4,0); ctx.lineTo(-3,-2); ctx.lineTo(-3,2); ctx.closePath(); ctx.fill();
  // コックピット発光
  ctx.fillStyle='#bfe2ff'; ctx.beginPath(); ctx.arc(2,0,1.6,0,7); ctx.fill();
  // 噴射
  ctx.fillStyle='rgba(120,200,255,'+(0.5+Math.random()*0.3)+')';
  ctx.beginPath(); ctx.moveTo(-7,-2);ctx.lineTo(-13-Math.random()*4,0);ctx.lineTo(-7,2);ctx.closePath();ctx.fill();
  ctx.restore(); ctx.globalAlpha=1;
}

function drawEnemy(e){
  const acc=STAGE_THEME[game.stage].accent;
  ctx.save(); ctx.translate(e.x,e.y);
  const flash=e.hitFlash>0;
  const col=flash?'#ffffff':acc;
  if(e.type==='carrier'){
    ctx.fillStyle=flash?'#fff':'#ffd06a';
    ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();
    ctx.strokeStyle='#fff8e0';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,e.r-2,0,7);ctx.stroke();
    ctx.fillStyle='#7a3'; ctx.font='8px serif'; ctx.textAlign='center'; ctx.fillText('膝',0,3);
  } else if(e.type==='dasher'){
    ctx.fillStyle=col; ctx.beginPath();ctx.moveTo(-e.r,0);ctx.lineTo(e.r,-e.r);ctx.lineTo(e.r,e.r);ctx.closePath();ctx.fill();
  } else if(e.type==='splitter'){
    ctx.fillStyle=col; ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-e.r,0);ctx.lineTo(e.r,0);ctx.moveTo(0,-e.r);ctx.lineTo(0,e.r);ctx.stroke();
  } else if(e.type==='homer'){
    ctx.fillStyle=col; ctx.beginPath();
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2;ctx.lineTo(Math.cos(a)*e.r,Math.sin(a)*e.r);}ctx.closePath();ctx.fill();
  } else if(e.type==='wave'){
    ctx.fillStyle=col; ctx.beginPath();ctx.ellipse(0,0,e.r,e.r*0.7,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,2,0,7);ctx.fill();
  } else {
    ctx.fillStyle=col; ctx.beginPath();ctx.arc(0,0,e.r,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-1,-1,1.6,0,7);ctx.fill();
  }
  ctx.restore();
}

function drawBoss(){
  ctx.save(); ctx.translate(boss.x,boss.y);
  const flash=boss.hitFlash>0;
  ctx.rotate(boss.t*0.01);
  ctx.strokeStyle=flash?'#fff':STAGE_THEME[boss.stage].accent; ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.stroke();
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2;ctx.fillStyle=flash?'#fff':'#888';
    ctx.beginPath();ctx.arc(Math.cos(a)*30,Math.sin(a)*30,4,0,7);ctx.fill();}
  ctx.rotate(-boss.t*0.02);
  ctx.fillStyle=flash?'#fff':'#c33';ctx.beginPath();ctx.arc(0,0,16,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,6,0,7);ctx.fill();
  ctx.restore();
  // HPバー
  ctx.fillStyle='#400';ctx.fillRect(LOGW/2-100,8,200,5);
  ctx.fillStyle='#f55';ctx.fillRect(LOGW/2-100,8,200*Math.max(0,boss.hp/boss.max),5);
}

function drawBullets(){
  // 自弾
  ctx.fillStyle='#bfe9ff';
  pBullets.each(b=>{ ctx.fillRect(b.x-3,b.y-1,6,2); });
  // 敵弾（最前面・高コントラスト・種別で色分け）
  const cols=['#ff5edb','#5 effff'.replace(' ',''),'#ffd23e','#ff7a3e','#ff3e8e','#9b5eff'];
  const palette=['#ff5edb','#5effff','#ffd23e','#ff7a3e','#ff3e8e','#9b5eff'];
  eBullets.each(b=>{
    const c=palette[b.kind]||'#ff5edb';
    ctx.fillStyle='#fff'; ctx.beginPath();ctx.arc(b.x,b.y,b.r+1,0,7);ctx.fill();
    ctx.fillStyle=c; ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
  });
}

function drawParticles(){ parts.each(p=>{ ctx.globalAlpha=p.life/p.max; ctx.fillStyle=p.col; ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2); }); ctx.globalAlpha=1; }
function drawCaps(){ caps.each(c=>{ ctx.fillStyle='#ffd06a';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);ctx.fill();
  ctx.fillStyle='#5a3';ctx.font='8px serif';ctx.textAlign='center';ctx.fillText('膝',c.x,c.y+3); }); }

function drawHUD(){
  ctx.fillStyle='#fff'; ctx.font='9px serif'; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('得点 '+game.score, 6, 12);
  ctx.fillText('残機 '+Math.max(0,game.lives), 6, 24);
  ctx.fillText('法力 '+game.bombs, 70, 24);
  if(game.combo>1){ ctx.fillStyle='#ffd23e'; ctx.fillText(game.combo+' 連', 6, 36); }
  // パワーバー（グラディウス風）
  const labels=['速度','連射','二連','OP1','OP2','MAX'];
  const bx=LOGW/2-90, by=LOGH-14;
  for(let i=0;i<6;i++){
    const on=i<player.power, sel=(i===player.power && player.pendingPower>0);
    ctx.fillStyle=sel?'#ffd23e':(on?'#4ea1ff':'rgba(255,255,255,0.15)');
    ctx.fillRect(bx+i*30,by,28,10);
    ctx.fillStyle=sel?'#000':'#fff'; ctx.font='7px serif'; ctx.textAlign='center';
    ctx.fillText(labels[i], bx+i*30+14, by+8);
  }
  // ボス警告
  if(game.bossWarn>0 && Math.floor(game.t/8)%2===0){
    ctx.fillStyle='#f33'; ctx.font='14px serif'; ctx.textAlign='center';
    ctx.fillText('！ 警告 ！', LOGW/2, LOGH/2-40);
  }
  // バナー
  if(game.bannerT>0){
    ctx.globalAlpha=Math.min(1,game.bannerT/30);
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,LOGH/2-16,LOGW,32);
    ctx.fillStyle='#fff';ctx.font='14px serif';ctx.textAlign='center';ctx.fillText(game.banner,LOGW/2,LOGH/2+5);
    ctx.globalAlpha=1;
  }
}

function drawTouchControls(){
  if(!('ontouchstart' in window)) return;
  // 移動スティック
  if(Touch.moveId>=0){
    ctx.globalAlpha=0.3;ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(Touch.bx,Touch.by,26,0,7);ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(Touch.mx,Touch.my,10,0,7);ctx.fill();
    ctx.globalAlpha=1;
  }
  // ボタン
  for(const b of Touch.buttons){
    ctx.globalAlpha=b.id>=0?0.5:0.25; ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
    ctx.globalAlpha=0.9;ctx.fillStyle='#000';ctx.font='9px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(b.label,b.x,b.y);
  }
  ctx.globalAlpha=1; ctx.textBaseline='alphabetic';
}

/* ストーリー文字：枠内垂直中央配置 */
function drawStory(){
  const theme=STAGE_THEME[game.stage]||STAGE_THEME[1];
  drawBackground(theme);
  const s=game.story, box=s.box;
  // 枠（墨風）
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(box.x,box.y,box.w,box.h);
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.strokeRect(box.x+3,box.y+3,box.w-6,box.h-6);
  // 表示行構築（タイプライター）
  const shown=[];
  for(let i=0;i<s.lines.length;i++){
    if(i<s.idx) shown.push(s.lines[i]);
    else if(i===s.idx) shown.push(s.lines[i].slice(0,Math.floor(s.char)));
    else break;
  }
  // 総ブロック高は最終総行数で確保 → 中心ブレ防止
  const lineH=24;
  const totalLines=s.lines.length;
  const totalH=totalLines*lineH;
  const startY=box.y+box.h/2 - totalH/2 + lineH/2;
  ctx.fillStyle='#f3f3f3'; ctx.font='13px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<shown.length;i++){ ctx.fillText(shown[i], box.x+box.w/2, startY+i*lineH); }
  // 続行プロンプト
  if(Math.floor(game.t/20)%2===0){
    ctx.fillStyle='#aaa';ctx.font='9px serif';
    ctx.fillText(s.idx>=s.lines.length?'▼ 押して開始':'▼ 押して進む', box.x+box.w/2, box.y+box.h-14);
  }
  ctx.textBaseline='alphabetic';
}

function drawTitle(){
  drawBackground(STAGE_THEME[1]);
  if(titleImgReady){
    const iw=titleImg.width, ih=titleImg.height;
    const scale=Math.min((LOGW*0.7)/iw,(LOGH*0.45)/ih);
    const w=iw*scale,h=ih*scale;
    // 視認性確保のため白背景の台座
    ctx.fillStyle='rgba(255,255,255,0.92)';
    ctx.fillRect((LOGW-w)/2-6, LOGH*0.1-6, w+12, h+12);
    ctx.drawImage(titleImg,(LOGW-w)/2,LOGH*0.1,w,h);
  }else{
    // テキストロゴ（フォールバック）
    ctx.save();
    ctx.textAlign='center'; ctx.font='bold 40px serif';
    ctx.shadowColor='#4ea1ff'; ctx.shadowBlur=18; ctx.fillStyle='#fff';
    ctx.fillText('HIZA', LOGW/2, LOGH*0.32);
    ctx.font='bold 22px serif'; ctx.fillText('Shooting', LOGW/2, LOGH*0.45);
    ctx.restore();
  }
  // 難易度選択
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const ds=game.difficulties; const cx=LOGW/2; const cy=LOGH*0.72;
  for(let i=0;i<3;i++){
    const sel=i===game.diffSel; const x=cx+(i-1)*110;
    ctx.fillStyle=sel?'#ffd23e':'rgba(255,255,255,0.4)';
    ctx.font=(sel?'bold 15px':'13px')+' serif';
    ctx.fillText(DIFF[ds[i]].label, x, cy);
  }
  ctx.fillStyle='#888';ctx.font='9px serif';
  ctx.fillText('← → で難易度選択', cx, cy+22);
  if(Math.floor(game.t/24)%2===0){
    ctx.fillStyle='#fff';ctx.font='12px serif';ctx.fillText('Z / タップで開始', cx, LOGH*0.92);
  }
  ctx.textBaseline='alphabetic';
}

function drawControls(){
  drawBackground(STAGE_THEME[1]);
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(40,30,LOGW-80,LOGH-60);
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.strokeRect(43,33,LOGW-86,LOGH-66);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='12px serif';
  const lineH=22; const totalH=CONTROLS.length*lineH;
  const sy=30+(LOGH-60)/2 - totalH/2 + lineH/2;
  ctx.textBaseline='middle';
  for(let i=0;i<CONTROLS.length;i++){
    ctx.fillStyle=(i===0)?'#ffd23e':(CONTROLS[i].startsWith('Z')?'#9fd2ff':'#eee');
    ctx.fillText(CONTROLS[i], LOGW/2, sy+i*lineH);
  }
  ctx.textBaseline='alphabetic';
}

function drawEndCard(title,sub){
  drawBackground(STAGE_THEME[3]);
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,LOGW,LOGH);
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='22px serif';
  ctx.fillText(title,LOGW/2,LOGH*0.36);
  ctx.font='12px serif';ctx.fillStyle='#ffd23e';
  ctx.fillText('得点 '+game.score+'　最大連 '+game.maxCombo, LOGW/2, LOGH*0.52);
  ctx.fillStyle='#ccc';ctx.font='10px serif';ctx.fillText(sub,LOGW/2,LOGH*0.62);
  if(Math.floor(game.t/24)%2===0){ ctx.fillStyle='#fff';ctx.fillText('Z / タップでタイトルへ',LOGW/2,LOGH*0.82); }
}

function draw(){
  ctx.setTransform(ctx.getTransform()); // keep dpr
  ctx.save();
  // 画面シェイク
  if(game.shake>0.4){ ctx.translate((Math.random()-0.5)*game.shake,(Math.random()-0.5)*game.shake); }

  if(game.state==='title'){ drawTitle(); }
  else if(game.state==='controls'){ drawControls(); }
  else if(game.state==='story'){ drawStory(); }
  else if(game.state==='ending'){ drawEndCard('生還','膝は前しか向かん。'); }
  else if(game.state==='gameover'){ drawEndCard('GAME OVER','膝、ここに尽きる…'); }
  else {
    const theme=STAGE_THEME[game.stage];
    drawBackground(theme);
    drawCaps();
    enemies.each(drawEnemy);
    if(boss.active)drawBoss();
    drawBullets();
    if(player.alive){
      let bank=0;
      if(Input.held('ArrowUp'))bank=-3; if(Input.held('ArrowDown'))bank=3;
      drawShip(player.x,player.y,bank,player.invuln>0);
      // オプション描画
      const nopt=Math.min(2,Math.max(0,player.power-2));
      for(let i=0;i<nopt;i++){ const p=player.trail[(i+1)*18]; if(p){ ctx.fillStyle='#7fb3ff';ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill(); } }
    }
    drawParticles();
    drawHUD();
    drawTouchControls();
    if(game.state==='paused'){
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,LOGW,LOGH);
      ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='20px serif';ctx.fillText('一時停止',LOGW/2,LOGH/2);
      ctx.font='10px serif';ctx.fillText('P / Esc で再開',LOGW/2,LOGH/2+22);
    }
  }
  ctx.restore();
}

/* ============================================================
   ループ（固定タイムステップ）
   ============================================================ */
let acc=0, last=performance.now(); const STEP=1000/60;
function loop(now){
  acc+=Math.min(100, now-last); last=now;
  while(acc>=STEP){
    update();
    Input.commit();   // ★ポーズ/ヒットストップ中でも必ず実行
    Touch.commit();
    acc-=STEP;
  }
  draw();
  requestAnimationFrame(loop);
}

/* ---------- init ---------- */
Input.init();
Touch.init();
fit();
requestAnimationFrame(loop);
</script>
