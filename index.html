"use strict";
/* =========================================================================
   HIZA Shooting v8
   - 自機 全画面移動可能化（右制限撤廃）
   - 装備の弱体化防止（LASER所持時にDOUBLE確定を無視）
   - チュートリアルページ追加（タイトルから導線）
   - タイトルを「はじめる / 遊び方」2択メニュー化
   - 画質：imageSmoothing=true / DPR対応（劣化させない）
   - タイトル画像 hiza.jpg 相対パス読込
   - Xキー preventDefault / blurで押下リセット
   - ストーリー：光門真理教 / ハードボイルド / 酒 / 膝
     「膝は前しか向かん」を 軽口→信条→教義 の三段で回収
   ========================================================================= */
const VW=480,VH=270;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
let scale=1;
function resize(){const ww=window.innerWidth,wh=window.innerHeight;scale=Math.min(ww/VW,wh/VH);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(VW*scale*dpr);cv.height=Math.round(VH*scale*dpr);
  cv.style.width=Math.round(VW*scale)+'px';cv.style.height=Math.round(VH*scale)+'px';
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);ctx.imageSmoothingEnabled=true;}
window.addEventListener('resize',resize);
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

/* ---------- タイトル画像（hiza.jpg 同階層） ---------- */
const titleImg=new Image();let titleImgOK=false;
titleImg.onload=()=>{titleImgOK=true;};
titleImg.onerror=()=>{titleImgOK=false;};
titleImg.src='hiza.jpg';

/* =========================================================================
   オーディオ（mp3クロスフェード / シンセフォールバック）
   ========================================================================= */
const Audio=(()=>{
  let actx=null,master=null,musicBus=null,sfxGain=null,started=false;
  const buffers={},loadTried={};
  const MP3={menu:'menu.mp3',stage1:'stage1.mp3',stage2:'stage2.mp3',stage3:'stage3.mp3',boss:'boss.mp3'};
  let trackA=null,trackB=null,activeTrack='A';
  let curName=null,fadeReq=null;
  function init(){if(actx)return;
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=0.7;master.connect(actx.destination);
    sfxGain=actx.createGain();sfxGain.gain.value=0.55;sfxGain.connect(master);}
  function loadMP3(name){if(loadTried[name])return;loadTried[name]=true;
    fetch(MP3[name]).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();})
      .then(ab=>actx.decodeAudioData(ab)).then(buf=>{buffers[name]=buf;
        if(curName===name)startTrack(name);}).catch(()=>{});}
  function startTrack(name){if(!buffers[name])return;
    const g=actx.createGain();g.gain.value=0;g.connect(master);
    const s=actx.createBufferSource();s.buffer=buffers[name];s.loop=true;s.connect(g);s.start();
    const t=actx.currentTime,FD=1.2;
    g.gain.linearRampToValueAtTime(0.5,t+FD);
    const old=(activeTrack==='A')?trackA:trackB;
    if(old){old.g.gain.cancelScheduledValues(t);old.g.gain.setValueAtTime(old.g.gain.value,t);
      old.g.gain.linearRampToValueAtTime(0,t+FD);
      const os=old.s;setTimeout(()=>{try{os.stop();}catch(e){}},FD*1000+100);}
    if(activeTrack==='A'){trackB={s,g};activeTrack='B';}else{trackA={s,g};activeTrack='A';}}
  let bgmTimer=null,step=0,intensity=0,key=0,synthOn=false,synthGain=null;
  const scl=[0,3,5,7,10,12],bf=110,nf=s=>bf*Math.pow(2,(s+key)/12);
  function ensureSynthGain(){if(!synthGain){synthGain=actx.createGain();synthGain.gain.value=0;synthGain.connect(master);}}
  function startSynth(){if(bgmTimer)return;ensureSynthGain();const iv=60/146/2*1000;
    bgmTimer=setInterval(()=>{if(!actx||intensity<=0||!synthOn)return;const t=actx.currentTime;
      if(step%2===0){const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';
        o.frequency.value=nf(scl[(Math.floor(step/4))%scl.length]-12);
        g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.13,t+0.01);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);o.connect(g);g.connect(synthGain);o.start(t);o.stop(t+0.2);}
      if(intensity>=1){const o=actx.createOscillator(),g=actx.createGain();o.type='square';
        o.frequency.value=nf(scl[step%scl.length]);g.gain.setValueAtTime(0.0001,t);
        g.gain.linearRampToValueAtTime(0.05,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
        o.connect(g);g.connect(synthGain);o.start(t);o.stop(t+0.13);}
      if(intensity>=2&&step%4===0){const o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';
        o.frequency.value=nf(scl[(step/4)%scl.length]+12);g.gain.setValueAtTime(0.0001,t);
        g.gain.linearRampToValueAtTime(0.045,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+0.3);
        o.connect(g);g.connect(synthGain);o.start(t);o.stop(t+0.32);}
      step=(step+1)%64;},iv);}
  function synthFade(to){if(!synthGain)return;const t=actx.currentTime;
    synthGain.gain.cancelScheduledValues(t);synthGain.gain.setValueAtTime(synthGain.gain.value,t);
    synthGain.gain.linearRampToValueAtTime(to,t+1.2);}
  function blip(f,d,t='square',v=0.3,sl=0){if(!actx)return;const tt=actx.currentTime;
    const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.setValueAtTime(f,tt);
    if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*sl),tt+d);
    g.gain.setValueAtTime(v,tt);g.gain.exponentialRampToValueAtTime(0.0001,tt+d);o.connect(g);g.connect(sfxGain);o.start(tt);o.stop(tt+d);}
  function blipAt(dl,f,d,t,v,sl){if(!actx)return;const tt=actx.currentTime+dl;
    const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.setValueAtTime(f,tt);
    if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*sl),tt+d);
    g.gain.setValueAtTime(v,tt);g.gain.exponentialRampToValueAtTime(0.0001,tt+d);o.connect(g);g.connect(sfxGain);o.start(tt);o.stop(tt+d);}
  function noise(d,v=0.4,hp=300){if(!actx)return;const tt=actx.currentTime,n=Math.floor(actx.sampleRate*d);
    const buf=actx.createBuffer(1,n,actx.sampleRate),dd=buf.getChannelData(0);
    for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*(1-i/n);const s=actx.createBufferSource();s.buffer=buf;
    const fl=actx.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;const g=actx.createGain();
    g.gain.setValueAtTime(v,tt);g.gain.exponentialRampToValueAtTime(0.0001,tt+d);s.connect(fl);fl.connect(g);g.connect(sfxGain);s.start(tt);}
  const SE={shot:()=>blip(880,0.05,'square',0.07,0.5),laser:()=>blip(1400,0.05,'sawtooth',0.05,0.6),
    hit:()=>blip(220,0.04,'square',0.09,0.7),explode:()=>noise(0.22,0.30,200),
    bigboom:()=>{noise(0.55,0.5,110);blip(100,0.55,'sawtooth',0.3,0.3);},capsule:()=>blip(1200,0.07,'sine',0.20,1.6),
    powerup:()=>{blip(660,0.07,'square',0.20);blipAt(0.07,990,0.12,'square',0.20,1);},
    bomb:()=>{noise(0.6,0.5,80);blip(140,0.6,'sine',0.3,0.4);},death:()=>blip(160,0.6,'sawtooth',0.4,0.25),
    warning:()=>blip(440,0.3,'sawtooth',0.16,1.0),menu:()=>blip(700,0.05,'sine',0.13,1.05),
    confirm:()=>{blip(523,0.06,'sine',0.16,1.05);blipAt(0.06,784,0.14,'sine',0.16,1.05);},
    combo:(n)=>blip(500+n*40,0.05,'sine',0.10,1.2),dash:()=>blip(300,0.15,'sawtooth',0.12,2.2),
    clear:()=>{[523,659,784].forEach((f,i)=>blipAt(i*0.12,f,0.18,'triangle',0.2));},
    ending:()=>{[523,659,784,1046].forEach((f,i)=>blipAt(i*0.2,f,0.45,'triangle',0.17));}};
  function playMusic(name,intens,k){
    if(curName===name && started){intensity=intens;key=k||0;return;}
    curName=name;intensity=intens;key=k||0;
    if(buffers[name]){synthOn=false;synthFade(0);startTrack(name);}
    else{synthOn=intens>0;loadMP3(name);ensureSynthGain();synthFade(intens>0?0.4:0);}}
  return {init(){init();},resume(){if(actx&&actx.state==='suspended')actx.resume();},
    boot(){if(!started){init();started=true;startSynth();}this.resume();for(const k in MP3)loadMP3(k);},
    playMusic,silence(){intensity=0;synthFade(0);
      [trackA,trackB].forEach(tk=>{if(tk){const t=actx.currentTime;tk.g.gain.linearRampToValueAtTime(0,t+1);}});curName=null;},
    SE};
})();

/* =========================================================================
   難易度
   ========================================================================= */
const DIFF={
  easy:{label:'EASY',desc:'初心者向け。膝に優しい',fireMul:2.6,bulletMul:0.6,hpMul:0.55,bossHpMul:0.5,invuln:170,lives:7,bombs:6,omni:false,diffSlope:0.4,startKit:true},
  normal:{label:'NORMAL',desc:'標準。ほどよい歯ごたえ',fireMul:1.6,bulletMul:0.85,hpMul:0.85,bossHpMul:0.85,invuln:130,lives:4,bombs:4,omni:false,diffSlope:0.7,startKit:false},
  hard:{label:'HARD',desc:'弾幕濃密。膝に来る',fireMul:1.15,bulletMul:1.0,hpMul:1.1,bossHpMul:1.15,invuln:100,lives:3,bombs:2,omni:true,diffSlope:1.0,startKit:false},
};
let CUR_DIFF=DIFF.normal;

/* ---------- 入力 ---------- */
const VBTN={slow:{x:VW-118,y:VH-30,w:34,h:24},confirm:{x:VW-80,y:VH-30,w:34,h:24},bomb:{x:VW-42,y:VH-30,w:34,h:24}};
const Input=(()=>{
  const keys={},cur={x:0,y:0,fire:false,confirm:false,bomb:false,slow:false,pause:false,anyEdge:false,tap:null};
  let pC=false,pB=false,pP=false,pA=false;
  window.addEventListener('keydown',e=>{keys[e.code]=true;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyZ','KeyX','KeyC'].includes(e.code))e.preventDefault();});
  window.addEventListener('keyup',e=>{keys[e.code]=false;
    if(['KeyZ','KeyX','KeyC'].includes(e.code))e.preventDefault();});
  window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
  const touches={};let moveX=0,moveY=0,moveAct=false,fireHold=false;
  let vbtn={slow:false,confirm:false,bomb:false},tEdge=false,tapPoint=null,cReq=false,bReq=false;
  function toL(cx,cy){const r=cv.getBoundingClientRect();return{x:(cx-r.left)/scale,y:(cy-r.top)/scale};}
  function hitBtn(lx,ly){for(const k in VBTN){const b=VBTN[k];if(lx>=b.x-4&&lx<=b.x+b.w+4&&ly>=b.y-4&&ly<=b.y+b.h+4)return k;}return null;}
  function tStart(e){Audio.resume();for(const t of e.changedTouches){const L=toL(t.clientX,t.clientY);const btn=hitBtn(L.x,L.y);
    if(btn){touches[t.identifier]={role:'btn',btn};if(btn==='slow')vbtn.slow=true;
      else if(btn==='confirm'){vbtn.confirm=true;cReq=true;}else if(btn==='bomb'){vbtn.bomb=true;bReq=true;}}
    else if(L.x<VW*0.42&&!moveAct){touches[t.identifier]={role:'move',ox:t.clientX,oy:t.clientY};moveAct=true;moveX=0;moveY=0;}
    else{touches[t.identifier]={role:'fire'};fireHold=true;}tEdge=true;tapPoint={x:L.x,y:L.y};}}
  function tMove(e){for(const t of e.changedTouches){const o=touches[t.identifier];if(!o)continue;
    if(o.role==='move'){const dx=t.clientX-o.ox,dy=t.clientY-o.oy,m=40;moveX=Math.max(-1,Math.min(1,dx/m));moveY=Math.max(-1,Math.min(1,dy/m));}}}
  function tEnd(e){for(const t of e.changedTouches){const o=touches[t.identifier];if(!o)continue;
    if(o.role==='move'){moveAct=false;moveX=0;moveY=0;}
    else if(o.role==='btn'){if(o.btn==='slow')vbtn.slow=false;else if(o.btn==='confirm')vbtn.confirm=false;else if(o.btn==='bomb')vbtn.bomb=false;}
    delete touches[t.identifier];}let af=false;for(const id in touches)if(touches[id].role==='fire')af=true;fireHold=af;}
  cv.addEventListener('touchstart',e=>{e.preventDefault();tStart(e);},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();tMove(e);},{passive:false});
  cv.addEventListener('touchend',e=>{e.preventDefault();tEnd(e);},{passive:false});
  cv.addEventListener('touchcancel',e=>{e.preventDefault();tEnd(e);},{passive:false});
  function poll(){let x=0,y=0;
    if(keys['ArrowLeft']||keys['KeyA'])x-=1;if(keys['ArrowRight']||keys['KeyD'])x+=1;
    if(keys['ArrowUp']||keys['KeyW'])y-=1;if(keys['ArrowDown']||keys['KeyS'])y+=1;
    let fire=!!(keys['KeyZ']||keys['Space']),confirm=!!keys['KeyX'],bomb=!!keys['KeyC'];
    let slow=!!(keys['ShiftLeft']||keys['ShiftRight']),pause=!!(keys['KeyP']||keys['Escape']);
    let anyRaw=fire||confirm||!!keys['Enter'];
    const gp=(navigator.getGamepads&&navigator.getGamepads()[0]);
    if(gp){const ax=gp.axes[0]||0,ay=gp.axes[1]||0;if(Math.abs(ax)>0.25)x+=ax;if(Math.abs(ay)>0.25)y+=ay;
      if(gp.buttons[0]&&gp.buttons[0].pressed){fire=true;anyRaw=true;}if(gp.buttons[2]&&gp.buttons[2].pressed)confirm=true;
      if(gp.buttons[1]&&gp.buttons[1].pressed)bomb=true;if(gp.buttons[5]&&gp.buttons[5].pressed)slow=true;
      if(gp.buttons[9]&&gp.buttons[9].pressed)pause=true;if(gp.buttons[7]&&gp.buttons[7].value>0.5)fire=true;}
    if(moveAct){x+=moveX;y+=moveY;}if(fireHold)fire=true;if(vbtn.slow)slow=true;
    let cE=cReq;cReq=false;let bE=bReq;bReq=false;if(vbtn.confirm||vbtn.bomb)anyRaw=true;
    const len=Math.hypot(x,y);if(len>1){x/=len;y/=len;}
    cur.x=x;cur.y=y;cur.fire=fire;cur.slow=slow;cur.confirm=(confirm&&!pC)||cE;pC=confirm;
    cur.bomb=(bomb&&!pB)||bE;pB=bomb;cur.pause=pause&&!pP;pP=pause;cur.anyEdge=(anyRaw&&!pA)||tEdge;pA=anyRaw;
    cur.tap=tEdge?tapPoint:null;tEdge=false;return cur;}
  return {poll,VBTN,vbtnState:()=>vbtn};
})();

/* ---------- プール ---------- */
class Pool{constructor(f,n){this.items=[];this.factory=f;for(let i=0;i<n;i++){const o=f();o.active=false;this.items.push(o);}}
  spawn(){for(const o of this.items)if(!o.active){o.active=true;return o;}const o=this.factory();o.active=true;this.items.push(o);return o;}
  forEach(fn){for(const o of this.items)if(o.active)fn(o);}}

function banner(t,tm){G.bannerText=t;G.bannerTimer=tm;}
function makePB(){return{x:0,y:0,vx:0,vy:0,type:'normal',active:false,r:2};}
function makeEB(){return{x:0,y:0,vx:0,vy:0,active:false,r:3,hue:300,homing:false,life:0};}
function makeEnemy(){return{x:0,y:0,vx:0,vy:0,hp:1,maxhp:1,type:'pop',active:false,r:8,
  fireTimer:0,hitFlash:0,carrier:false,boss:false,t:0,enterT:0,amp:0,baseY:0,diff:1,state:0,dashT:0};}
function makePart(){return{x:0,y:0,vx:0,vy:0,life:0,maxlife:0,active:false,r:2,hue:30};}
function makeCap(){return{x:0,y:0,vx:0,vy:0,active:false,r:6,t:0};}
function makeFloat(){return{x:0,y:0,vy:0,life:0,active:false,text:'',hue:50};}
function initPools(){G.pBullets=new Pool(makePB,220);G.eBullets=new Pool(makeEB,700);

function initNebula(){G.nebula=[];for(let i=0;i<6;i++)G.nebula.push({

  G.bossExplodeTimer=0;G.bossExplodePos=null;G.bannerText='';G.bannerTimer=0;
  G.player.x=60;G.player.y=VH/2;Audio.playMusic(st.mus,1,st.key);banner(st.name,160);G.state='play';}
function newGame(){initPools();initNebula();

/* ---------- ヘルパ ---------- */
function spawnParticles(x,y,n,hue,spd){for(let i=0;i<n;i++){const p=G.particles.spawn();
  const a=Math.random()*Math.PI*2,s=spd*(0.3+Math.random()*0.7);p.x=x;p.y=y;p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s;
  p.maxlife=p.life=20+Math.random()*20;p.r=1+Math.random()*2;p.hue=hue+(Math.random()*30-15);}}
function spawnEB(x,y,vx,vy,hue,homing){const m=CUR_DIFF.bulletMul;const b=G.eBullets.spawn();
  b.x=x;b.y=y;b.vx=vx*m;b.vy=vy*m;b.r=3;b.hue=hue;b.homing=!!homing;b.life=homing?180:0;}
function fireAtPlayer(x,y,sp,hue,spread=0,homing){const dx=G.player.x-x,dy=G.player.y-y;
  const a=Math.atan2(dy,dx)+spread;spawnEB(x,y,Math.cos(a)*sp,Math.sin(a)*sp,hue,homing);}
function floatText(x,y,text,hue){const f=G.floaters.spawn();f.x=x;f.y=y;f.vy=-0.6;f.life=50;f.text=text;f.hue=hue;}
function spawnEnemy(type,x,y,opts={},diff=1){const e=G.enemies.spawn();
  e.x=x;e.y=y;e.t=0;e.enterT=0;e.fireTimer=0;e.hitFlash=0;e.boss=false;e.carrier=!!opts.carrier;e.type=type;e.state=0;e.dashT=0;
  e.diff=1+(diff-1)*CUR_DIFF.diffSlope;const hm=CUR_DIFF.hpMul;
  if(type==='pop'){e.hp=e.maxhp=1;e.r=7;e.vx=-1.6;e.vy=0;}
  else if(type==='wave'){e.hp=e.maxhp=Math.max(1,Math.round((2+Math.floor(diff/2))*hm));e.r=8;e.vx=-1.2;e.vy=0;e.amp=opts.amp||30;e.baseY=y;}
  else if(type==='turret'){e.hp=e.maxhp=Math.max(2,Math.round((5+diff*2)*hm));e.r=10;e.vx=-0.7;e.vy=0;}
  else if(type==='dasher'){e.hp=e.maxhp=Math.max(2,Math.round(3*hm));e.r=8;e.vx=-1.0;e.vy=0;e.baseY=y;}
  else if(type==='splitter'){e.hp=e.maxhp=Math.max(2,Math.round(4*hm));e.r=9;e.vx=-0.9;e.vy=0;e.amp=20;e.baseY=y;}
  else if(type==='homer'){e.hp=e.maxhp=Math.max(2,Math.round(4*hm));e.r=9;e.vx=-0.7;e.vy=0;e.baseY=y;}
  else if(type==='boss'){e.hp=e.maxhp=Math.round((200+diff*90)*CUR_DIFF.bossHpMul);e.r=28;e.vx=-0.5;e.vy=0;e.boss=true;}
  return e;}

/* ---------- パワーアップ/コンボ/被弾 ---------- */
function gainCapsule(){G.powerBar=(G.powerBar+1)%6;Audio.SE.capsule();}
function confirmPower(){if(G.powerBar<0)return;const i=G.powerBar,eq=G.equip;
  if(i===0){if(eq.speed<5)eq.speed++;}
  else if(i===1)eq.missile=true;
  else if(i===2){if(eq.laser)return; eq.double=true;}   // LASER所持時はDOUBLE確定を無視（弱体化防止）
  else if(i===3){eq.laser=true;eq.double=false;}         // LASERは上位なので常に昇格
  else if(i===4){if(eq.options<4){eq.options++;G.options.push({x:G.player.x,y:G.player.y});}}
  else if(i===5){eq.shield=true;G.shieldHp=3;}
  Audio.SE.powerup();floatText(G.player.x,G.player.y-12,G.POWER_NAMES[i]+'!',50);G.powerBar=-1;}
function addScore(n,x,y){const mult=1+Math.floor(G.combo/10)*0.5,gain=Math.floor(n*mult);
  G.score+=gain;if(x!==undefined)floatText(x,y,'+'+gain,G.combo>=10?50:200);}
function bumpCombo(){G.combo++;G.comboTimer=120;if(G.combo>G.comboMax)G.comboMax=G.combo;if(G.combo>1&&G.combo%5===0)Audio.SE.combo(G.combo);}
function playerHit(){if(G.invuln>0)return false;
  if(G.equip.shield&&G.shieldHp>0){G.shieldHp--;if(G.shieldHp<=0)G.equip.shield=false;
    G.invuln=70;G.shake=8;Audio.SE.hit();spawnParticles(G.player.x,G.player.y,8,150,3);return true;}
  G.lives--;Audio.SE.death();G.shake=16;G.flash=1;G.hitstop=8;spawnParticles(G.player.x,G.player.y,30,200,4);G.combo=0;
  if(G.equip.options>0){G.equip.options--;G.options.pop();}else if(G.equip.laser)G.equip.laser=false;
  else if(G.equip.double)G.equip.double=false;else if(G.equip.missile)G.equip.missile=false;
  else if(G.equip.speed>0)G.equip.speed=Math.max(0,G.equip.speed-1);
  G.invuln=CUR_DIFF.invuln;if(G.lives<0)G.state='over';return true;}
function useBomb(){if(G.bombs<=0)return;G.bombs--;Audio.SE.bomb();G.flash=1;G.shake=12;G.invuln=Math.max(G.invuln,90);
  G.eBullets.forEach(b=>{spawnParticles(b.x,b.y,2,180,2);b.active=false;});
  G.enemies.forEach(e=>{e.hp-=8;e.hitFlash=6;if(e.hp<=0)killEnemy(e);});}
function killEnemy(e){e.active=false;
  if(e.boss){addScore(10000);G.bossExplodeTimer=130;G.bossExplodePos={x:e.x,y:e.y};
    Audio.SE.bigboom();G.flash=1;G.shake=18;G.hitstop=18;G.timeScale=0.2;return;}
  if(e.type==='splitter'){for(let i=0;i<6;i++){const a=i/6*Math.PI*2;spawnEB(e.x,e.y,Math.cos(a)*1.3,Math.sin(a)*1.3,200);}}
  bumpCombo();
  const pts={turret:300,wave:150,dasher:200,splitter:250,homer:250,pop:50};
  addScore(pts[e.type]||50,e.x,e.y);
  Audio.SE.explode();spawnParticles(e.x,e.y,12,30,3);G.shake=Math.max(G.shake,2);
  if(e.carrier){const c=G.capsules.spawn();c.x=e.x;c.y=e.y;c.vx=-1;c.vy=0;c.t=0;}}
function circleHit(x1,y1,r1,x2,y2,r2){const dx=x1-x2,dy=y1-y2,rr=r1+r2;return dx*dx+dy*dy<rr*rr;}
function onBossCleared(){if(G.stageIndex<STAGES.length-1){Audio.SE.clear();
    beginStory(STAGES[G.stageIndex+1].story,()=>startStage(G.stageIndex+1));}
  else{Audio.SE.ending();Audio.playMusic('menu',0,0);G.endStep=0;G.endTimer=0;G.state='ending';}}

/* ---------- 更新 ---------- */
function update(inp){G.globalT++;for(const n of G.nebula)n.ph+=0.005*n.sp;
  if(G.state!=='play')return;
  if(G.bossExplodeTimer>0){G.bossExplodeTimer--;
    if(G.bossExplodeTimer%10===0&&G.bossExplodePos)spawnParticles(G.bossExplodePos.x+(Math.random()*50-25),G.bossExplodePos.y+(Math.random()*50-25),18,40,4);
    if(G.bossExplodeTimer<=0){onBossCleared();return;}
    G.particles.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=0.94;pt.vy*=0.94;pt.life--;if(pt.life<=0)pt.active=false;});
    if(G.timeScale<1)G.timeScale=Math.min(1,G.timeScale+0.02);if(G.shake>0)G.shake*=0.9;if(G.flash>0)G.flash-=0.04;return;}
  if(G.hitstop>0){G.hitstop--;return;}if(G.timeScale<1)G.timeScale=Math.min(1,G.timeScale+0.04);
  G.stageTime++;G.bgScroll=(G.bgScroll+1.2)%VW;
  if(G.warning>0)G.warning--;if(G.invuln>0)G.invuln--;if(G.shake>0)G.shake*=0.86;
  if(G.flash>0)G.flash-=0.06;if(G.bannerTimer>0)G.bannerTimer--;if(G.comboTimer>0){G.comboTimer--;if(G.comboTimer<=0)G.combo=0;}
  const st=STAGES[G.stageIndex],diff=G.stageIndex+1;
  while(G.waveIndex<st.waves.length&&G.stageTime>=st.waves[G.waveIndex].t){st.waves[G.waveIndex].fn(diff);G.waveIndex++;}
  const p=G.player,baseSpd=1.6+G.equip.speed*0.45,spd=inp.slow?baseSpd*0.4:baseSpd;
  p.x+=inp.x*spd;p.y+=inp.y*spd;p.bank=(p.bank||0)*0.8+inp.y*0.2;
  p.x=Math.max(8,Math.min(VW-8,p.x));p.y=Math.max(8,Math.min(VH-8,p.y));  // 全画面移動可能
  G.posHistory.unshift({x:p.x,y:p.y});if(G.posHistory.length>200)G.posHistory.pop();
  for(let i=0;i<G.options.length;i++){const idx=Math.min((i+1)*22,G.posHistory.length-1);
    const tp=G.posHistory[idx];if(tp){G.options[i].x=tp.x;G.options[i].y=tp.y;}}
  if(p.shotCd>0)p.shotCd--;
  if(inp.fire&&p.shotCd<=0){fireWeapon(p.x+8,p.y);for(const o of G.options)fireWeapon(o.x+6,o.y);
    p.shotCd=G.equip.laser?5:7;G.equip.laser?Audio.SE.laser():Audio.SE.shot();}
  if(inp.confirm)confirmPower();if(inp.bomb)useBomb();
  G.pBullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x>VW+20||b.x<-20||b.y<-20||b.y>VH+20)b.active=false;});
  G.capsules.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.t++;if(c.x<-20)c.active=false;
    if(circleHit(c.x,c.y,c.r,p.x,p.y,p.r+4)){c.active=false;gainCapsule();}});
  const fm=CUR_DIFF.fireMul;
  G.enemies.forEach(e=>{e.t++;if(e.enterT<30)e.enterT++;if(e.hitFlash>0)e.hitFlash--;
    if(e.boss){updateBoss(e);}
    else if(e.type==='dasher'){
      if(e.state===0){e.x+=e.vx;if(e.x<VW-40){e.state=1;e.dashT=30;}}
      else if(e.state===1){e.dashT--;e.x+=0.1*Math.sin(e.t*0.5);if(e.dashT<=0){e.state=2;e.vx=-6.5;Audio.SE.dash();}}
      else{e.x+=e.vx;}
      if(e.x<-30)e.active=false;
    }
    else if(e.type==='splitter'){e.x+=e.vx;e.y=e.baseY+Math.sin(e.t*0.05)*e.amp;
      if(e.x<VW-4&&e.enterT>=20){e.fireTimer++;if(e.fireTimer>=Math.max(80,140*fm)){e.fireTimer=0;fireAtPlayer(e.x,e.y,1.3,300);}}
      if(e.x<-30)e.active=false;}
    else if(e.type==='homer'){e.x+=e.vx;e.y=e.baseY+Math.sin(e.t*0.04)*30;
      if(e.x<VW-4&&e.enterT>=24){e.fireTimer++;if(e.fireTimer>=Math.max(110,170*fm)){e.fireTimer=0;
        fireAtPlayer(e.x,e.y,1.1,160,0,true);}}
      if(e.x<-30)e.active=false;}
    else{e.x+=e.vx;e.y+=e.vy;if(e.type==='wave')e.y=e.baseY+Math.sin(e.t*0.06)*e.amp;
      if(e.x<VW-4&&e.enterT>=20){e.fireTimer++;
        const baseIv=(e.type==='turret'?90:200)-e.diff*5,iv=Math.max(60,baseIv*fm),bsp=1.1+e.diff*0.10;
        if(e.fireTimer>=iv){e.fireTimer=0;

function drawLogoFallback(cx,cy,t){ctx.textAlign='center';const pulse=0.6+0.4*Math.sin(t*0.05);
  ctx.shadowColor='#4ea1ff';ctx.shadowBlur=14*pulse;ctx.fillStyle='#fff';ctx.font='bold 44px serif';ctx.fillText('膝',cx,cy);
  ctx.shadowBlur=6*pulse;ctx.fillStyle='#cfe2ff';ctx.font='bold 22px serif';ctx.fillText('HIZA Shooting',cx,cy+30);
  ctx.shadowBlur=0;ctx.textAlign='left';}
function drawStory(){drawBackground();ctx.textAlign='center';const lines=G.storyLines[G.storyStep]||[];
  const full=lines.join('\n');G.storyChars=Math.min(G.storyChars+0.8,full.length);
  const shown=Math.floor(G.storyChars);const a=Math.min(1,G.storyTimer/20);
  const boxY=VH/2-46,boxH=82;
  ctx.fillStyle='rgba(0,0,0,'+(0.6*a)+')';ctx.fillRect(30,boxY,VW-60,boxH);
  ctx.strokeStyle='rgba(255,255,255,'+(0.4*a)+')';ctx.lineWidth=1;ctx.strokeRect(30.5,boxY+0.5,VW-61,boxH-1);
  const lineH=19,totalH=lines.length*lineH;
  const startY=boxY+boxH/2-totalH/2+lineH-6;
  ctx.fillStyle='rgba(245,245,245,'+a+')';ctx.font='12px serif';
  let cnt=0;
  for(let i=0;i<lines.length;i++){let line='';for(let c=0;c<lines[i].length;c++){if(cnt<shown){line+=lines[i][c];cnt++;}}
    ctx.fillText(line,VW/2,startY+i*lineH);if(cnt>=shown)break;}
  ctx.fillStyle='rgba(200,200,200,'+(0.5*a)+')';ctx.font='9px serif';
  if(Math.floor(G.storyTimer/30)%2===0)ctx.fillText(isTouch?'［ タップで次へ ］':'［ Z／タップで次へ ］',VW/2,VH-14);
  ctx.textAlign='left';drawVignette();}
function drawTutorial(){drawBackground();ctx.textAlign='center';
  const page=TUTORIAL[G.tutoStep]||TUTORIAL[0];
  const bx=34,by=30,bw=VW-68,bh=VH-72;
  ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);
  ctx.fillStyle='#ffd23e';ctx.font='bold 13px serif';ctx.fillText(page.title,VW/2,by+22);
  ctx.fillStyle='#eef4ff';ctx.font='11px serif';
  const lineH=16,startY=by+46;
  for(let i=0;i<page.lines.length;i++)ctx.fillText(page.lines[i],VW/2,startY+i*lineH);
  ctx.fillStyle='#9fb8d8';ctx.font='9px serif';
  ctx.fillText((G.tutoStep+1)+' / '+TUTORIAL.length,VW/2,VH-26);
  if(Math.floor(G.menuTimer/30)%2===0){const last=G.tutoStep>=TUTORIAL.length-1;
    ctx.fillStyle='#fff';ctx.fillText(isTouch?(last?'［ タップでタイトルへ ］':'［ タップで次へ ］'):(last?'［ Z／Escでタイトルへ ］':'［ Zで次へ／Escで戻る ］'),VW/2,VH-12);}
  ctx.textAlign='left';drawVignette();}
function drawTitle(){
  drawBackground();
  if(titleImgOK){const iw=titleImg.width,ih=titleImg.height,r=Math.min(300/iw,140/ih);
    const w=iw*r,h=ih*r,cx=VW/2,cy=88;
    ctx.fillStyle='rgba(255,255,255,0.92)';roundRect(cx-w/2-6,cy-h/2-6,w+12,h+12,6);ctx.fill();
    ctx.drawImage(titleImg,cx-w/2,cy-h/2,w,h);}
  else drawLogoFallback(VW/2,78,G.menuTimer);
  ctx.textAlign='center';
  const sel=G.titleSel||0;
  ctx.fillStyle=sel===0?'#ffd23e':'#9fb8d8';ctx.font=(sel===0?'bold 16px':'14px')+' serif';
  ctx.fillText((sel===0?'▶ ':'')+'はじめる',VW/2,VH-46);
  ctx.fillStyle=sel===1?'#ffd23e':'#9fb8d8';ctx.font=(sel===1?'bold 16px':'14px')+' serif';
  ctx.fillText((sel===1?'▶ ':'')+'遊び方',VW/2,VH-24);
  ctx.fillStyle='#6a86a8';ctx.font='8px serif';
  ctx.fillText(isTouch?'項目をタップ':'↑↓で選択／Zで決定',VW/2,VH-6);
  ctx.textAlign='left';}
function drawDiffSelect(){
  drawBackground();
  if(titleImgOK){const iw=titleImg.width,ih=titleImg.height,r=Math.min(120/iw,60/ih);
    const w=iw*r,h=ih*r,cx=VW/2,cy=40;ctx.fillStyle='rgba(255,255,255,0.9)';roundRect(cx-w/2-4,cy-h/2-4,w+8,h+8,4);ctx.fill();
    ctx.drawImage(titleImg,cx-w/2,cy-h/2,w,h);}
  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 13px serif';ctx.fillText('難易度を選んでくだされ',VW/2,90);
  const keys=['easy','normal','hard'];
  for(let i=0;i<3;i++){const d=DIFF[keys[i]],sel=i===G.diffSel,y=118+i*40;
    ctx.fillStyle=sel?'#3a5a8a':'rgba(255,255,255,0.08)';ctx.strokeStyle=sel?'#fff':'rgba(255,255,255,0.4)';ctx.lineWidth=sel?2:1;
    roundRect(VW/2-115,y-15,230,32,4);ctx.fill();ctx.stroke();
    ctx.fillStyle=sel?'#fff':'#cfe2ff';ctx.font='bold 14px serif';ctx.fillText(d.label,VW/2,y);
    ctx.fillStyle=sel?'#cde':'#889';ctx.font='9px serif';ctx.fillText(d.desc,VW/2,y+13);}
  ctx.fillStyle='#cfe2ff';ctx.font='9px serif';ctx.fillText(isTouch?'［ 項目をタップで決定 ］':'［ ↑↓で選択／Zで決定 ］',VW/2,VH-10);
  ctx.textAlign='left';}
function drawPause(){ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,VW,VH);ctx.textAlign='center';
  ctx.fillStyle='#fff';ctx.font='bold 22px serif';ctx.fillText('休 止',VW/2,VH/2-8);
  ctx.font='10px serif';ctx.fillStyle='#ccc';ctx.fillText(isTouch?'タップで再開':'P／Esc で再開',VW/2,VH/2+16);ctx.textAlign='left';}
function drawResult(){drawBackground();ctx.textAlign='center';
  ctx.fillStyle='#fff';ctx.font='bold 24px serif';ctx.fillText('膝、限界',VW/2,VH/2-34);
  ctx.fillStyle='#ddd';ctx.font='11px serif';ctx.fillText('第'+(G.stageIndex+1)+'霊脈にて力尽きる ['+CUR_DIFF.label+']',VW/2,VH/2-8);
  ctx.fillText('得点 '+G.score,VW/2,VH/2+12);ctx.fillText('最大連 '+G.comboMax,VW/2,VH/2+28);
  if(Math.floor(G.menuTimer/30)%2===0){ctx.fillStyle='#fff';ctx.font='bold 14px serif';ctx.fillText('▼ 押して再挑戦 ▼',VW/2,VH/2+54);}
  ctx.textAlign='left';drawVignette();}
function drawEnding(){drawBackground();ctx.textAlign='center';
  const lines=ENDING[G.endStep]||[],a=Math.min(1,G.endTimer/40),last=G.endStep>=ENDING.length-1;
  ctx.fillStyle=last?'rgba(255,255,255,'+Math.min(1,G.endTimer/40)+')':'rgba(245,245,245,'+a+')';
  ctx.font=last?'bold 13px serif':'12px serif';
  const lineH=20,totalH=lines.length*lineH,startY=VH/2-totalH/2+lineH-6;
  for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],VW/2,startY+i*lineH);
  if(last){ctx.fillStyle='#ddd';ctx.font='11px serif';ctx.fillText('得点 '+G.score,VW/2,VH/2+38);
    ctx.fillText('最大連 '+G.comboMax+' ['+CUR_DIFF.label+']',VW/2,VH/2+54);
    if(Math.floor(G.endTimer/30)%2===0){ctx.fillStyle='#bbb';ctx.font='10px serif';ctx.fillText(isTouch?'［ タップでタイトルへ ］':'［ Z／タップでタイトルへ ］',VW/2,VH-14);}}
  else{ctx.fillStyle='rgba(200,200,200,'+(0.5*a)+')';ctx.font='9px serif';
    if(Math.floor(G.endTimer/30)%2===0)ctx.fillText('［ タップで次へ ］',VW/2,VH-14);}
  ctx.textAlign='left';drawVignette();}

function render(inp){ctx.clearRect(0,0,VW,VH);
  if(G.state==='opening'){drawBackground();
    if(titleImgOK){const iw=titleImg.width,ih=titleImg.height,r=Math.min(320/iw,180/ih);
      const w=iw*r,h=ih*r,cx=VW/2,cy=VH/2-15;ctx.fillStyle='rgba(255,255,255,0.92)';roundRect(cx-w/2-6,cy-h/2-6,w+12,h+12,6);ctx.fill();
      ctx.drawImage(titleImg,cx-w/2,cy-h/2,w,h);}
    else drawLogoFallback(VW/2,VH/2-20,G.menuTimer);ctx.textAlign='center';
    if(Math.floor(G.menuTimer/30)%2===0){ctx.fillStyle='#fff';ctx.font='bold 14px serif';ctx.fillText('▼ 押して始める ▼',VW/2,VH-22);}
    ctx.textAlign='left';return;}
  if(G.state==='story'){drawStory();return;}if(G.state==='title'){drawTitle();return;}
  if(G.state==='tutorial'){drawTutorial();return;}
  if(G.state==='diff'){drawDiffSelect();return;}if(G.state==='ending'){drawEnding();return;}
  let sx=0,sy=0;if(G.shake>0.5){sx=(Math.random()*2-1)*G.shake;sy=(Math.random()*2-1)*G.shake;}
  ctx.save();ctx.translate(sx,sy);drawBackground();
  drawCapsules();drawPlayerBullets();drawEnemies();drawPlayer(inp);drawEnemyBullets();drawParticles();drawFloaters();ctx.restore();
  if(G.flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(0.8,G.flash)+')';ctx.fillRect(0,0,VW,VH);}
  drawVignette();drawHUD();drawVButtons();
  if(G.warning>0&&Math.floor(G.warning/8)%2===0){ctx.textAlign='center';ctx.fillStyle='#f55';ctx.font='bold 20px serif';
    ctx.fillText('！ 敵機接近 ！',VW/2,VH/2);ctx.fillStyle='#fff';ctx.font='10px serif';ctx.fillText('膝を据えて構えよ',VW/2,VH/2+16);ctx.textAlign='left';}
  if(G.state==='pause')drawPause();if(G.state==='over')drawResult();}

/* ---------- 状態遷移 ---------- */
const _ke={};let _keys={};
window.addEventListener('keydown',e=>{_keys[e.code]=true;});window.addEventListener('keyup',e=>{_keys[e.code]=false;});
function keyEdge(code){const now=!!_keys[code],was=_ke[code];_ke[code]=now;return now&&!was;}
function tapInDiff(tap){if(!tap)return -1;for(let i=0;i<3;i++){const y=118+i*40;if(tap.x>VW/2-115&&tap.x<VW/2+115&&tap.y>y-15&&tap.y<y+17)return i;}return -1;}
function handleMeta(inp){
  if(G.state==='opening'){G.menuTimer++;if(inp.anyEdge){Audio.SE.menu();Audio.playMusic('menu',0,0);G.state='title';G.menuTimer=0;}return;}
  if(G.state==='title'){G.menuTimer++;
    if(keyEdge('ArrowUp')||keyEdge('ArrowDown')){G.titleSel=1-(G.titleSel||0);Audio.SE.menu();}
    if(inp.tap){
      if(inp.tap.y>VH-60&&inp.tap.y<VH-38){G.titleSel=0;Audio.SE.confirm();G.state='diff';G.menuTimer=0;return;}
      if(inp.tap.y>=VH-38&&inp.tap.y<VH-14){G.titleSel=1;Audio.SE.confirm();G.tutoStep=0;G.state='tutorial';G.menuTimer=0;return;}
    }
    if(inp.anyEdge&&!inp.tap){
      if((G.titleSel||0)===0){Audio.SE.confirm();G.state='diff';G.menuTimer=0;}
      else{Audio.SE.confirm();G.tutoStep=0;G.state='tutorial';G.menuTimer=0;}
    }
    return;}
  if(G.state==='tutorial'){G.menuTimer++;
    if(keyEdge('Escape')){G.state='title';G.menuTimer=0;Audio.SE.menu();return;}
    if(inp.anyEdge){const last=G.tutoStep>=TUTORIAL.length-1;
      if(last){Audio.SE.confirm();G.state='title';G.menuTimer=0;}
      else{Audio.SE.menu();G.tutoStep++;}}
    return;}
  if(G.state==='diff'){G.menuTimer++;
    if(inp.tap){const t=tapInDiff(inp.tap);if(t>=0){G.diffSel=t;CUR_DIFF=DIFF[['easy','normal','hard'][t]];Audio.SE.confirm();newGame();return;}}
    if(keyEdge('ArrowUp')){G.diffSel=(G.diffSel+2)%3;Audio.SE.menu();}
    if(keyEdge('ArrowDown')){G.diffSel=(G.diffSel+1)%3;Audio.SE.menu();}
    if(inp.anyEdge&&!inp.tap){CUR_DIFF=DIFF[['easy','normal','hard'][G.diffSel]];Audio.SE.confirm();newGame();}return;}
  if(G.state==='story'){G.storyTimer++;if(inp.anyEdge){Audio.SE.menu();G.storyStep++;G.storyTimer=0;G.storyChars=0;
    if(G.storyStep>=G.storyLines.length){const cb=G.afterStory;G.afterStory=null;if(cb)cb();}}return;}
  if(G.state==='play'){if(inp.pause){G.state='pause';Audio.SE.menu();}return;}
  if(G.state==='pause'){if(inp.pause||inp.anyEdge){G.state='play';Audio.SE.menu();}return;}
  if(G.state==='ending'){G.endTimer++;if(inp.anyEdge){const last=G.endStep>=ENDING.length-1;
    if(last){Audio.SE.confirm();Audio.playMusic('menu',0,0);G.state='title';G.menuTimer=0;}else{Audio.SE.menu();G.endStep++;G.endTimer=0;}}return;}
  if(G.state==='over'){G.menuTimer++;if(inp.anyEdge){Audio.SE.confirm();Audio.playMusic('menu',0,0);G.state='title';G.menuTimer=0;}return;}}

/* ---------- メインループ ---------- */
let lastTime=0,acc=0;const STEP=1000/60;let lastInp={slow:false};
function loop(now){requestAnimationFrame(loop);if(!lastTime)lastTime=now;let dt=now-lastTime;lastTime=now;if(dt>250)dt=250;
  acc+=dt;let steps=0;while(acc>=STEP&&steps<5){const inp=Input.poll();lastInp=inp;handleMeta(inp);update(inp);acc-=STEP;steps++;}
  render(lastInp);}
document.addEventListener('pointerdown',()=>Audio.boot(),{once:true});
window.addEventListener('keydown',()=>Audio.boot(),{once:true});
initStars();initNebula();resize();requestAnimationFrame(loop);
</script>
